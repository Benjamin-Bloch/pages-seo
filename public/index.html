<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" />
<style>
  :root {
    --bg: #06080d; --bg-card: #0f1520;
    --ink: #e8edf2; --ink-dim: #a3aec0; --ink-faint: #6a7484;
    --accent: #7afff0; --accent-soft: rgba(122,255,240,0.10);
    --line-2: rgba(255,255,255,0.18);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background:
      radial-gradient(1000px 500px at 50% -10%, var(--accent-soft), transparent 60%)
      var(--bg);
    color: var(--ink); font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 32px 20px;
  }
  .card {
    width: min(420px, 100%);
    background: var(--bg-card); border: 1px solid var(--line-2);
    border-radius: 16px; padding: 36px 32px 28px; text-align: center;
  }
  .dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 5px rgba(122,255,240,0.15); margin-bottom: 18px;
  }
  h1 {
    margin: 0 0 8px; font-family: 'Instrument Serif', Georgia, serif;
    font-weight: 400; font-size: 28px; letter-spacing: -0.01em;
  }
  h1 em { font-style: italic; color: var(--accent); }
  p { margin: 0 0 24px; color: var(--ink-dim); font-size: 14px; line-height: 1.55; }
  .btn {
    display: inline-block; padding: 12px 24px; border-radius: 10px;
    background: var(--accent); color: #06080d; font-weight: 600; font-size: 14px;
    text-decoration: none; transition: transform .12s;
  }
  .btn:hover { transform: translateY(-1px); }
  footer {
    margin-top: 22px; font-size: 11px; color: var(--ink-faint);
    letter-spacing: .04em; text-transform: uppercase; font-family: ui-monospace, monospace;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="dot" aria-hidden="true"></span>
    <h1><em>Welcome.</em></h1>
    <p>This site is managed by its admin. If that's you, sign in to make changes.</p>
    <a class="btn" href="/admin">Sign in</a>
    <footer>Powered by pages-seo</footer>
  </div>
</body>
</html>
