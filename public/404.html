<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>404 · page not found</title>
<meta name="robots" content="noindex" />
<link rel="preload" href="/_fonts/instrument-serif-400.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/marketing.css" />
<style>
  .nf { min-height: 70vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 24px; }
  .nf-inner h1 {
    font-family: var(--font-serif); font-weight: 400;
    font-size: clamp(4rem, 12vw, 8rem); line-height: 1; margin: 0 0 8px;
  }
  .nf-inner h1 em { font-style: italic; position: relative; }
  .nf-inner h1 em::after {
    content: ""; position: absolute; left: -2px; right: -2px; bottom: 0.08em;
    height: 0.3em; z-index: -1; border-radius: 3px;
    background: var(--highlight); transform: rotate(-0.6deg);
  }
  .nf-inner p { color: var(--muted); margin: 0 0 28px; }
  .nf-links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<header class="nav">
  <a class="brand" href="/"><span class="brand-dot"></span> pages-seo</a>
</header>
<main class="nf">
  <div class="nf-inner">
    <h1><em>404</em></h1>
    <p>This page doesn't exist — it may have moved, or the link was mistyped.</p>
    <div class="nf-links">
      <a class="btn primary" href="/">Go home</a>
      <a class="btn" href="/blog">Read the blog</a>
    </div>
  </div>
</main>
</body>
</html>
